<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema 2</title>
    <style>
        
        body {
            background-color: rgb(65, 65, 65);
            color: white;
        }

        div.um {
            width: auto;
            height: auto;
            border: 1px solid white;
        }
        
        div.dois {
            width: 200px;
            height: 20px;
            border: 1px solid white;
        }

        div.tres {
            width: 60%;
            border: 1px solid white;
        }
    </style>
</head>
<body>
    <h2>Largura - width</h2>
    
    <div class="um">Um</div>
    <br>
    <div class="dois">Dois</div>
    <br>
    <div class="tres">Três</div>
</body>
</html>
